# 午夜黑卡（midnight-card）— 所有可调参数都在本文件，无需改代码。
# 不要在此填写账号 ID。database_id 是占位符：一键部署会自动创建 D1 并替换它，
# 命令行部署时由 `npm run setup` 创建/查找 D1 并写入真实 ID。
name = "midnight-card"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# 前端静态资源：直接由 CDN 返回，不经过 Worker，不计入请求数。
# 只有 /api/* 会进入 Worker。
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "midnight-card"
database_id = "d404ba25-a357-412c-aa5e-9f93f2a34f66"
migrations_dir = "migrations"  # 表结构变更；deploy 时自动 apply

[vars]
DOMAIN = "sqw.cc.cd"       # 收信域名（必须改成你的域名）
RETENTION_HOURS = "24"       # 邮件保留小时数
MAX_RAW_BYTES = "1048576"    # 原始邮件超过此大小直接拒收（1MB）
MAX_BODY_BYTES = "204800"    # 存储的正文上限，超出截断（200KB）
POLL_SECONDS = "10"          # 前端轮询间隔（秒，最小 10）
BLOCKED_SENDERS = "none"     # 拒收发件人/域名，逗号分隔；none 表示不启用
EXTRA_RESERVED = "none"      # 额外保留前缀，逗号分隔；none 表示不启用
FORWARD_TO = "none"          # 保留前缀邮件转发到此已验证地址；none 表示直接拒收

# API 速率限制：每个 IP 每 60 秒最多 60 次（轮询 10s 一次只用 6 次）。
# namespace_id 是你自己挑的整数，不是账号 ID。
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "4201"
simple = { limit = 60, period = 60 }

# 每小时清理一次过期邮件（单条 DELETE）。
[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true

# 可选：给网站绑定自定义域名（需在 Cloudflare 托管该域名）
# routes = [{ pattern = "mail.example.com", custom_domain = true }]
